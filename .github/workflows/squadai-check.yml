name: squadai-check

on:
  pull_request:
    paths:
      - '.squadai/**'

jobs:
  squadai:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      # Build from the PR so the check runs the CLI under review, not the last release.
      - name: Install squadai
        run: go install ./cmd/squadai
      # validate-policy exits non-zero when policy.json is absent, and policy is optional.
      - name: Validate policy
        if: hashFiles('.squadai/policy.json') != ''
        run: squadai validate-policy
      - name: Diff check
        run: squadai diff --exit-code
